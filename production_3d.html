<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jannah Light - Production LED en Algérie</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #050505; color: white; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .ui-overlay { position: relative; z-index: 2; padding: 20px; pointer-events: none; }
        .card { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); padding: 20px; border-right: 4px solid #ffcc00; width: 300px; pointer-events: auto; }
        h1 { color: #ffcc00; margin: 0; font-size: 1.5rem; }
        .stat { margin: 15px 0; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .value { font-weight: bold; color: #00d4ff; }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <div class="card">
            <h1>Jannah Light LED</h1>
            <p>خطة الإنتاج والتوسع في الجزائر</p>
            <div class="stat">السنة 1: <span class="value">12,000 وحدة</span></div>
            <div class="stat">السنة 2: <span class="value">18,000 وحدة</span></div>
            <div class="stat">السنة 3: <span class="value">25,000 وحدة</span></div>
            <div class="stat">الأرباح (س 3): <span class="value">60 مليون دج</span></div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffcc00, 2);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        // LED Bulbs (Visual representation)
        const bulbs = [];
        for(let i = 0; i < 3; i++) {
            const group = new THREE.Group();
            const geometry = new THREE.SphereGeometry(0.8, 32, 32);
            const material = new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0x333300, transparent: true, opacity: 0.8 });
            const bulb = new THREE.Mesh(geometry, material);
            group.add(bulb);
            group.position.x = (i - 1) * 3;
            scene.add(group);
            bulbs.push(group);
        }

        camera.position.z = 8;
        const controls = new OrbitControls(camera, renderer.domElement);

        function animate() {
            requestAnimationFrame(animate);
            bulbs.forEach((b, i) => {
                b.rotation.y += 0.01;
                b.position.y = Math.sin(Date.now() * 0.002 + i) * 0.5;
            });
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
