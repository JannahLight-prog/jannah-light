<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jannah Light - Home Page</title>
    <style>
        :root {
            --gold: #d4af37;
            --dark: #1a1a1a;
            --white: #ffffff;
            --card-bg: #252525;
        }
        body { background-color: var(--dark); color: var(--white); font-family: Arial, sans-serif; margin: 0; padding: 20px; text-align: center; }
        
        .top-bar { display: flex; justify-content: flex-start; max-width: 1200px; margin: 0 auto 10px auto; padding: 0 10px; }
        .lang-switcher { display: flex; gap: 8px; align-items: center; font-size: 0.85em; background: var(--card-bg); padding: 6px 12px; border-radius: 20px; border: 1px solid #333; }
        .lang-switcher a { color: #888; text-decoration: none; padding: 2px 6px; border-radius: 4px; }
        .lang-switcher a.active { color: var(--gold); font-weight: bold; }

        .hero { padding: 40px 20px; margin-bottom: 20px; }
        .hero h1 { color: var(--gold); font-size: 2.5em; margin-bottom: 10px; }
        
        .brand-statement { max-width: 800px; margin: 0 auto 30px auto; padding: 25px; background: linear-gradient(135deg, #1f1f1f, #252525); border-left: 4px solid var(--gold); border-right: 4px solid var(--gold); border-radius: 8px; }
        
        .counters-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto 40px auto; }
        .counter-box { background: var(--card-bg); border: 1px solid #333; padding: 20px; border-radius: 12px; }
        .counter-number { font-size: 2.2em; color: var(--gold); font-weight: bold; }
        
        .strategy-map { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .box { background: var(--card-bg); border: 1px solid #333; padding: 20px; border-radius: 15px; color: var(--white); text-decoration: none; display: block; }

        .trust-section { margin: 50px auto 20px auto; max-width: 1200px; }
        .badges-grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .badge-card { background: #1f1f1f; border: 1px dashed rgba(212, 175, 55, 0.4); padding: 10px 20px; border-radius: 8px; font-size: 0.9em; }

        .presentation-section { background: #111; padding: 30px 15px; border-top: 2px solid var(--gold); }
        .slides-carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; gap: 15px; padding-bottom: 15px; }
        .slides-carousel::-webkit-scrollbar { display: none; }
        .slide-item { flex: 0 0 100%; scroll-snap-align: start; }
        .slide-item img { width: 100%; max-width: 650px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="lang-switcher">
            <a href="#" class="active">العربية</a> | <a href="#">Français</a> | <a href="#">English</a>
        </div>
    </div>

    <div class="hero">
        <h1>JANNAH LIGHT</h1>
        <p>An independent and innovative industrial project for manufacturing energy-efficient LED lamps. <strong>Made in Algeria</strong></p>
    </div>

    <div class="brand-statement">
        <h2>Total Quantity & Quality</h2>
        <p>In <strong>Jannah Light</strong> factory</p>
    </div>

    <div class="counters-container">
        <div class="counter-box"><div class="counter-number" data-target="80">0</div><div class="counter-label">Energy Saving (%)</div></div>
        <div class="counter-box"><div class="counter-number" data-target="50">0</div><div class="counter-label">Hours Lifespan (K)</div></div>
        <div class="counter-box"><div class="counter-number" data-target="100">0</div><div class="counter-label">Algerian Quality (%)</div></div>
    </div>

    <div class="presentation-section">
        <h2 style="color: var(--gold);">Strategic Business Plan</h2>
        <div class="slides-carousel">
            <!-- تمت إضافة الصور هنا -->
            <div class="slide-item"><img src="presentation/slide1.png" alt="Slide 1"></div>
            <div class="slide-item"><img src="presentation/slide2.png" alt="Slide 2"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll('.counter-number').forEach(counter => {
                const target = +counter.getAttribute('data-target');
                counter.innerText = target;
            });
        });
    </script>
</body>
</html>
